<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>RunningHub Clear Studio</title>
<style>
  :root {
    --safe-top: 24px;
    --safe-bottom: 16px;
    --bg: #090B10;
    --surface: #10131B;
    --surface-2: #161A25;
    --surface-3: #1E2433;
    --border: rgba(255, 255, 255, 0.08);
    --border-hi: rgba(255, 255, 255, 0.16);
    --text: #EEF2F8;
    --text-2: #9AA5BA;
    --text-3: #647087;
    --accent: #38BDF8;
    --accent-bg: rgba(56, 189, 248, 0.14);
    --ok: #10B981;
    --ok-bg: rgba(16, 185, 129, 0.14);
    --warn: #F59E0B;
    --warn-bg: rgba(245, 158, 11, 0.14);
    --err: #EF4444;
    --err-bg: rgba(239, 68, 68, 0.14);
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 9px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
  }

  /* Header */
  .topbar {
    padding: calc(var(--safe-top) + 10px) 14px 10px 14px;
    background: rgba(16, 19, 27, 0.94);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .logo-box {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(145deg, #162238, #0D1320);
    border: 1px solid rgba(56, 189, 248, 0.35);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .brand-text {
    min-width: 0;
  }

  .brand-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand-sub {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--ok);
    margin-top: 1px;
  }

  .dot-live {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 10px;
    height: 36px;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease, opacity 0.15s ease;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn:disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  .btn-primary {
    background: #0EA5E9;
    border-color: rgba(56, 189, 248, 0.5);
    color: #05101A;
    font-weight: 700;
  }

  .btn-ok {
    background: #10B981;
    border-color: rgba(16, 185, 129, 0.5);
    color: #04150E;
    font-weight: 700;
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-2);
    padding: 0 10px;
  }

  /* Queue Strip */
  .queue-strip {
    display: none;
    flex-shrink: 0;
    padding: 8px 12px;
    gap: 8px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    scrollbar-width: none;
  }

  .queue-strip::-webkit-scrollbar {
    display: none;
  }

  .queue-strip.has-items {
    display: flex;
  }

  .q-chip {
    flex-shrink: 0;
    width: 158px;
    padding: 7px 9px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
  }

  .q-chip.active {
    border-color: rgba(56, 189, 248, 0.65);
    background: rgba(56, 189, 248, 0.08);
  }

  .q-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .q-name {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .q-close {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-2);
    font-size: 12px;
    line-height: 18px;
    text-align: center;
    padding: 0;
  }

  .q-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--text-3);
  }

  .q-badge {
    padding: 1px 6px;
    border-radius: 99px;
    font-weight: 600;
    font-size: 10px;
  }

  .st-done { background: var(--ok-bg); color: var(--ok); }
  .st-processing, .st-queued { background: var(--accent-bg); color: var(--accent); }
  .st-skipped { background: var(--warn-bg); color: var(--warn); }
  .st-error { background: var(--err-bg); color: var(--err); }

  /* Main Stage */
  .main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 10px 12px;
    gap: 10px;
    overflow: hidden;
  }

  /* Empty State */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    padding: 8px 4px;
  }

  .hero-card {
    background: var(--surface);
    border: 1px dashed var(--border-hi);
    border-radius: var(--radius-lg);
    padding: 24px 18px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .hero-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: rgba(56, 189, 248, 0.10);
    border: 1px solid rgba(56, 189, 248, 0.25);
    display: grid;
    place-items: center;
    color: var(--accent);
  }

  .hero-title {
    font-size: 17px;
    font-weight: 700;
  }

  .hero-desc {
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.55;
    max-width: 300px;
  }

  .hero-btn {
    width: 100%;
    max-width: 260px;
    height: 44px;
    border-radius: 12px;
    font-size: 14px;
    margin-top: 4px;
  }

  .feat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .feat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px;
  }

  .feat-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 99px;
    background: var(--accent-bg);
    color: var(--accent);
    margin-bottom: 6px;
  }

  .feat-tag.green {
    background: var(--ok-bg);
    color: var(--ok);
  }

  .feat-name {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .feat-info {
    font-size: 11px;
    color: var(--text-3);
    line-height: 1.45;
  }

  .tip-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 11px 13px;
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.5;
  }

  /* Active Viewer */
  .viewer-wrap {
    flex: 1;
    min-height: 0;
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .viewer-wrap.visible {
    display: flex;
  }

  .seg-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    flex-shrink: 0;
  }

  .seg-btn {
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 12px;
    font-weight: 600;
    padding: 7px 4px;
    border-radius: 8px;
  }

  .seg-btn.active {
    background: var(--surface-3);
    color: var(--text);
  }

  .seg-btn:disabled {
    opacity: 0.35;
  }

  .stage {
    flex: 1;
    min-height: 0;
    position: relative;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: #06080C;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,0.025) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,0.025) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.025) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.025) 75%);
    background-size: 18px 18px;
    background-position: 0 0, 0 9px, 9px -9px, -9px 0;
    overflow: hidden;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .img-layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    pointer-events: none;
  }

  .img-layer img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    display: block;
  }

  .wipe-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #FFFFFF;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 6;
  }

  .wipe-knob {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #0EA5E9;
    border: 2px solid #FFFFFF;
    color: #05101A;
    font-size: 12px;
    font-weight: 800;
    display: grid;
    place-items: center;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
  }

  .stage-pill {
    position: absolute;
    top: 10px;
    padding: 4px 9px;
    border-radius: 99px;
    background: rgba(9, 11, 16, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    z-index: 5;
    pointer-events: none;
  }

  .stage-pill.left { left: 10px; }
  .stage-pill.right { right: 10px; }

  .busy-overlay {
    position: absolute;
    inset: 0;
    background: rgba(9, 11, 16, 0.76);
    backdrop-filter: blur(4px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    padding: 20px;
    text-align: center;
  }

  .busy-overlay.visible {
    display: flex;
  }

  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.12);
    border-top-color: var(--accent);
    animation: spin 0.85s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Telemetry Strip */
  .info-card {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
  }

  .info-detail {
    font-size: 11.5px;
    color: var(--text-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Bottom Dock */
  .bottom-dock {
    flex-shrink: 0;
    padding: 10px 12px calc(var(--safe-bottom) + 10px) 12px;
    background: rgba(16, 19, 27, 0.96);
    border-top: 1px solid var(--border);
    display: none;
    gap: 8px;
  }

  .bottom-dock.visible {
    display: flex;
  }

  .dock-main {
    flex: 1;
    height: 44px;
    border-radius: 11px;
    font-size: 14px;
  }

  .dock-sub {
    height: 44px;
    padding: 0 14px;
    border-radius: 11px;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M5 19L19 5" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M14 4L15.2 6.8L18 8L15.2 9.2L14 12L12.8 9.2L10 8L12.8 6.8L14 4Z" fill="#EEF2F8"/>
          <rect x="4" y="4" width="6" height="4" rx="1.2" stroke="#9AA5BA" stroke-width="1.5" stroke-dasharray="2 2"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">RunningHub 去水印</div>
        <div class="brand-sub"><span class="dot-live"></span><span>离线本地无损引擎</span></div>
      </div>
    </div>
    <div class="top-actions">
      <button id="btnClear" class="btn btn-ghost" onclick="clearQueue()" disabled>清空</button>
      <button class="btn btn-primary" onclick="pickImages()">+ 选图</button>
    </div>
  </header>

  <div id="queueStrip" class="queue-strip"></div>

  <main class="main">
    <section id="emptyState" class="empty-state">
      <div class="hero-card">
        <div class="hero-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/>
            <path d="M7 15L10.5 11.5L13.5 14.5L16.5 11L19 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="8.5" cy="8.5" r="1.4" fill="currentColor"/>
          </svg>
        </div>
        <div class="hero-title">全分辨率无损去除 RunningHub AI 水印</div>
        <div class="hero-desc">全程在手机本地运行，不上传任何图片到云端。支持单张与多张批量处理。</div>
        <button class="btn btn-primary hero-btn" onclick="pickImages()">选择手机里的图片</button>
      </div>

      <div class="feat-grid">
        <div class="feat-card">
          <span class="feat-tag green">Mode-A</span>
          <div class="feat-name">PNG Alpha 逆混合</div>
          <div class="feat-info">直连原图 Alpha 通道逐像素数学还原，水印区域 0 涂抹痕迹。</div>
        </div>
        <div class="feat-card">
          <span class="feat-tag">Mode-B</span>
          <div class="feat-name">JPG 梯度匹配修复</div>
          <div class="feat-info">QQ/微信转发压缩图自动多尺度锁定四角水印并亚像素还原。</div>
        </div>
      </div>

      <div class="tip-card">
        <strong>快捷用法：</strong>在手机 QQ、微信或系统相册看图时，点击「分享 / 其他应用打开」选择 <strong>RunningHub 去水印</strong>，即可一键直达清洗。
      </div>
    </section>

    <section id="viewerWrap" class="viewer-wrap">
      <div class="seg-bar">
        <button class="seg-btn active" data-view="zoom_wipe" onclick="setViewMode('zoom_wipe')">特写对比</button>
        <button class="seg-btn" data-view="full_wipe" onclick="setViewMode('full_wipe')">全图对比</button>
        <button class="seg-btn" data-view="clean_full" onclick="setViewMode('clean_full')">去水印后</button>
        <button class="seg-btn" data-view="orig_full" onclick="setViewMode('orig_full')">原图</button>
      </div>

      <div id="stage" class="stage">
        <div id="afterLayer" class="img-layer">
          <img id="imgAfter" alt="" />
        </div>
        <div id="beforeLayer" class="img-layer">
          <img id="imgBefore" alt="" />
        </div>

        <span id="pillBefore" class="stage-pill left">原图</span>
        <span id="pillAfter" class="stage-pill right">去水印后</span>

        <div id="wipeLine" class="wipe-line" style="left: 50%;">
          <div class="wipe-knob">&lt;&gt;</div>
        </div>

        <div id="busyOverlay" class="busy-overlay">
          <div class="spinner"></div>
          <div id="busyText" style="font-size: 13px; color: var(--text-2);">正在去除水印...</div>
        </div>
      </div>

      <div class="info-card">
        <div class="info-row">
          <span id="infoBadge" class="q-badge st-done">Mode-A</span>
          <span id="infoStats" style="color: var(--text-2); font-variant-numeric: tabular-nums;">-</span>
        </div>
        <div id="infoDetail" class="info-detail">-</div>
      </div>
    </section>
  </main>

  <footer id="bottomDock" class="bottom-dock">
    <button id="btnSaveOne" class="btn btn-ok dock-main" onclick="saveSelected()">保存到相册</button>
    <button id="btnShareOne" class="btn dock-sub" onclick="shareSelected()">分享</button>
    <button id="btnSaveAll" class="btn dock-sub" style="display:none;" onclick="saveAll()">全部保存</button>
  </footer>
</div>

<script>
  let appState = { items: [], selected_id: null, total: 0, done_count: 0, unsaved_count: 0 };
  let viewMode = 'zoom_wipe';
  let wipeRatio = 0.5;
  let dragging = false;

  const qs = (id) => document.getElementById(id);

  function pickImages() {
    window.AndroidBridge && window.AndroidBridge.pickImages();
  }

  function clearQueue() {
    window.AndroidBridge && window.AndroidBridge.clearQueue();
  }

  function selectItem(id) {
    window.AndroidBridge && window.AndroidBridge.selectItem(id);
  }

  function removeItem(ev, id) {
    ev.stopPropagation();
    window.AndroidBridge && window.AndroidBridge.removeItem(id);
  }

  function saveSelected() {
    if (!appState.selected_id || !window.AndroidBridge) return;
    window.AndroidBridge.saveItemToGallery(appState.selected_id);
  }

  function saveAll() {
    window.AndroidBridge && window.AndroidBridge.saveAllToGallery();
  }

  function shareSelected() {
    if (!appState.selected_id || !window.AndroidBridge) return;
    window.AndroidBridge.shareItem(appState.selected_id);
  }

  function setViewMode(mode) {
    viewMode = mode;
    document.querySelectorAll('.seg-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.view === mode);
    });
    renderSelected();
  }

  function applyWipe() {
    const pct = Math.max(2, Math.min(98, wipeRatio * 100));
    const isWipe = (viewMode === 'zoom_wipe' || viewMode === 'full_wipe');
    const beforeLayer = qs('beforeLayer');
    const afterLayer = qs('afterLayer');
    const wipeLine = qs('wipeLine');
    const pillBefore = qs('pillBefore');
    const pillAfter = qs('pillAfter');

    if (isWipe) {
      afterLayer.style.display = 'flex';
      beforeLayer.style.display = 'flex';
      beforeLayer.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
      wipeLine.style.display = 'block';
      wipeLine.style.left = pct + '%';
      pillBefore.style.display = 'inline-block';
      pillAfter.style.display = 'inline-block';
    } else if (viewMode === 'orig_full') {
      afterLayer.style.display = 'none';
      beforeLayer.style.display = 'flex';
      beforeLayer.style.clipPath = 'none';
      wipeLine.style.display = 'none';
      pillBefore.style.display = 'inline-block';
      pillAfter.style.display = 'none';
    } else {
      afterLayer.style.display = 'flex';
      beforeLayer.style.display = 'none';
      wipeLine.style.display = 'none';
      pillBefore.style.display = 'none';
      pillAfter.style.display = 'inline-block';
    }
  }

  // Smooth touch/pointer swipe on comparison stage
  const stage = qs('stage');
  function updateWipeFromPointer(e) {
    const rect = stage.getBoundingClientRect();
    if (rect.width <= 0) return;
    wipeRatio = Math.max(0.02, Math.min(0.98, (e.clientX - rect.left) / rect.width));
    applyWipe();
  }
  stage.addEventListener('pointerdown', (e) => {
    if (viewMode !== 'zoom_wipe' && viewMode !== 'full_wipe') return;
    dragging = true;
    stage.setPointerCapture && stage.setPointerCapture(e.pointerId);
    updateWipeFromPointer(e);
  });
  stage.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    updateWipeFromPointer(e);
  });
  const endDrag = () => { dragging = false; };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  function statusText(st) {
    if (st === 'done') return '已完成';
    if (st === 'processing') return '处理中';
    if (st === 'queued') return '排队中';
    if (st === 'skipped') return '未修改';
    return '失败';
  }

  function renderQueue() {
    const strip = qs('queueStrip');
    const items = appState.items || [];
    qs('btnClear').disabled = items.length === 0;

    if (items.length === 0) {
      strip.classList.remove('has-items');
      strip.innerHTML = '';
      return;
    }

    strip.classList.add('has-items');
    strip.innerHTML = items.map((it) => {
      const active = it.id === appState.selected_id ? 'active' : '';
      const sub = it.status === 'done'
        ? `${it.mode || '完成'} · ${it.elapsed}s`
        : statusText(it.status);
      return `
        <div class="q-chip ${active}" onclick="selectItem('${it.id}')">
          <div class="q-top">
            <div class="q-name">${escapeHtml(it.name)}</div>
            <button class="q-close" onclick="removeItem(event, '${it.id}')">×</button>
          </div>
          <div class="q-meta">
            <span class="q-badge st-${it.status}">${statusText(it.status)}</span>
            <span>${escapeHtml(sub)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderSelected() {
    const items = appState.items || [];
    const cur = items.find((x) => x.id === appState.selected_id) || null;
    const emptyEl = qs('emptyState');
    const viewerEl = qs('viewerWrap');
    const dockEl = qs('bottomDock');

    if (!cur) {
      emptyEl.style.display = 'flex';
      viewerEl.classList.remove('visible');
      dockEl.classList.remove('visible');
      return;
    }

    emptyEl.style.display = 'none';
    viewerEl.classList.add('visible');
    dockEl.classList.add('visible');

    // Segmented button availability
    const zoomBtn = document.querySelector('[data-view="zoom_wipe"]');
    const fullWipeBtn = document.querySelector('[data-view="full_wipe"]');
    const cleanBtn = document.querySelector('[data-view="clean_full"]');
    const origBtn = document.querySelector('[data-view="orig_full"]');

    const done = cur.status === 'done';
    zoomBtn.disabled = !(done && cur.has_zoom);
    fullWipeBtn.disabled = !(done && cur.has_full);
    cleanBtn.disabled = !(done && cur.has_full);
    origBtn.disabled = !cur.has_full;

    if (!done && cur.has_full) {
      viewMode = 'orig_full';
    } else if (done && viewMode === 'zoom_wipe' && !cur.has_zoom) {
      viewMode = 'full_wipe';
    }
    document.querySelectorAll('.seg-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.view === viewMode);
    });

    const busyEl = qs('busyOverlay');
    if (cur.status === 'queued' || cur.status === 'processing') {
      busyEl.classList.add('visible');
      qs('busyText').textContent = cur.detail || '正在去除水印...';
    } else {
      busyEl.classList.remove('visible');
    }

    const base = 'http://appassets.local/api/preview?id=' + encodeURIComponent(cur.id);
    const imgBefore = qs('imgBefore');
    const imgAfter = qs('imgAfter');

    if (viewMode === 'zoom_wipe' && cur.has_zoom) {
      imgBefore.src = base + '&kind=orig_zoom';
      imgAfter.src = base + '&kind=clean_zoom';
    } else {
      imgBefore.src = cur.has_full ? (base + '&kind=orig_full') : '';
      imgAfter.src = (done && cur.has_full) ? (base + '&kind=clean_full') : '';
    }
    applyWipe();

    // Info card
    const badge = qs('infoBadge');
    badge.className = 'q-badge st-' + cur.status;
    badge.textContent = done ? (cur.mode_label || cur.mode) : statusText(cur.status);

    const dims = (cur.width && cur.height) ? `${cur.width}×${cur.height}` : '-';
    const stats = done
      ? `${dims} · ${cur.out_size_mb} MB · ${cur.elapsed}s`
      : dims;
    qs('infoStats').textContent = stats;
    qs('infoDetail').textContent = cur.detail || '';

    // Dock buttons
    const btnSave = qs('btnSaveOne');
    const btnShare = qs('btnShareOne');
    const btnSaveAll = qs('btnSaveAll');

    btnSave.disabled = !done;
    btnShare.disabled = !done;
    btnSave.textContent = cur.saved ? '已存相册 · 再存一份' : '保存原画到相册';

    if ((appState.unsaved_count || 0) > 1) {
      btnSaveAll.style.display = 'inline-flex';
      btnSaveAll.textContent = `全部保存 (${appState.unsaved_count})`;
    } else {
      btnSaveAll.style.display = 'none';
    }
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  window.__onState = function(next) {
    if (!next) return;
    const prevSel = appState.selected_id;
    appState = next;
    if (next.selected_id && next.selected_id !== prevSel) {
      viewMode = 'zoom_wipe';
      wipeRatio = 0.5;
    }
    renderQueue();
    renderSelected();
  };

  document.addEventListener('DOMContentLoaded', () => {
    if (window.AndroidBridge && window.AndroidBridge.getStateJson) {
      try {
        window.__onState(JSON.parse(window.AndroidBridge.getStateJson()));
      } catch (e) {}
    }
  });
</script>
</body>
</html>
